  <title>Планишка · Наизусть</title>
  <meta name="robots" content="noindex">
  <script>
    // Старый адрес тренажёра v1 → «Наизусть» в «Окне» на том же origin (данные v1 доступны миграции).
    // Query и hash сохраняются: в них параметры запуска Telegram (tgWebAppData, tgWebAppStartParam…).
    (function () {
      var hash = String(location.hash || '').replace(/^#/, '');
      location.replace('./' + location.search + '#' + (hash ? hash + '&' : '') + 'start=learn');
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./#start=learn">
  <style>
    html { color-scheme: dark light; }
    body { margin: 0; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: #05070D; color: #A6B0C8; font: 15px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; }
    a { color: #7AA5FF; }
    @media (prefers-color-scheme: light) {
      body { background: #F6F8FC; color: #475370; }
      a { color: #1846B8; }
    }
  </style>
</head>
<body>
  <p>Тренажёр теперь живёт в «Окне» — вкладка «Наизусть». <a href="./#start=learn">Открыть</a></p>
