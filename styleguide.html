  <style>
    /* Витрина дизайн-системы (.sg-). Только токены tokens.css. */
    .sg-root {
      height: var(--app-vh);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .sg-bar {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: var(--z-tabbar);
      background: var(--tabbar-bg);
      border-bottom: var(--bw) solid var(--line);
      padding-top: var(--app-inset-top);
      padding-top: max(var(--app-inset-top), env(safe-area-inset-top, 0px));
    }

    @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      html[data-blur="on"] .sg-bar {
        background: var(--tabbar-bg-blur);
        -webkit-backdrop-filter: blur(16px) saturate(1.4);
        backdrop-filter: blur(16px) saturate(1.4);
      }
    }

    .sg-bar-in {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      max-width: calc(var(--content-max) + var(--sp-12) * 5);
      margin: 0 auto;
      padding: var(--sp-2) var(--gutter);
    }

    .sg-brand {
      display: flex;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
      min-height: var(--tap-min);
      margin-right: var(--sp-4);
    }

    .sg-brand .ui-icon {
      margin-right: var(--sp-3);
      color: var(--text);
    }

    .sg-brand-name {
      font-size: var(--fs-title-3);
      line-height: var(--lh-title-3);
      font-weight: var(--fw-title-3);
      letter-spacing: var(--ls-title-3);
      white-space: nowrap;
    }

    .sg-brand-sub {
      margin-left: var(--sp-2);
      font-size: var(--fs-callout);
      line-height: var(--lh-callout);
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sg-controls {
      display: grid;
      grid-template-columns: calc(var(--h-seg) * 2 + var(--sp-1)) minmax(0, 1fr);
      grid-gap: var(--sp-2);
      gap: var(--sp-2);
      flex: 1 1 calc(var(--sp-12) * 7);
      max-width: calc(var(--sp-12) * 9);
      padding: var(--sp-1) 0;
    }

    .sg-nav {
      display: flex;
      overflow-x: auto;
      max-width: calc(var(--content-max) + var(--sp-12) * 5);
      margin: 0 auto;
      padding: var(--sp-1) var(--gutter) var(--sp-3);
      scrollbar-width: none;
    }

    .sg-nav::-webkit-scrollbar {
      display: none;
    }

    .sg-nav > * + * {
      margin-left: var(--sp-2);
    }

    .sg-main {
      max-width: calc(var(--content-max) + var(--sp-12) * 5);
      margin: 0 auto;
      padding: var(--sp-6) var(--gutter) var(--sp-12);
      padding-bottom: calc(var(--sp-12) * 2 + var(--app-inset-bottom));
      padding-bottom: calc(var(--sp-12) * 2 + max(var(--app-inset-bottom), env(safe-area-inset-bottom, 0px)));
    }

    .sg-sec {
      padding-top: var(--sp-10);
      scroll-margin-top: calc(var(--sp-12) * 3);
    }

    .sg-sec:first-child {
      padding-top: 0;
    }

    .sg-sec-title {
      font-size: var(--fs-title-1);
      line-height: var(--lh-title-1);
      font-weight: var(--fw-title-1);
      letter-spacing: var(--ls-title-1);
    }

    .sg-sec-lead {
      max-width: calc(var(--sp-12) * 13);
      margin-top: var(--sp-2);
      font-size: var(--fs-callout);
      line-height: var(--lh-callout);
      color: var(--text-2);
    }

    .sg-sub {
      margin: var(--sp-8) 0 var(--sp-3);
      font-size: var(--fs-caption);
      line-height: var(--lh-caption);
      font-weight: var(--fw-strong);
      color: var(--text-3);
    }

    .sg-sec-title + :not(.sg-sec-lead):not(.sg-sub),
    .sg-sec-lead + :not(.sg-sub) {
      margin-top: var(--sp-5);
    }

    .sg-sec-lead + .sg-sub,
    .sg-sec-title + .sg-sub {
      margin-top: var(--sp-6);
    }

    .sg-panel {
      padding: var(--sp-5);
      border-radius: var(--r-md);
      background: var(--surface-1);
      box-shadow: var(--elev-1);
    }

    @media (max-width: 399px) {
      .sg-panel {
        padding: var(--sp-4);
      }
    }

    .sg-panel.is-bg {
      background: var(--bg);
      box-shadow: inset 0 0 0 var(--bw) var(--line);
    }

    .sg-ctx {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(var(--sp-12) * 2);
      border: var(--bw) dashed var(--line-strong);
      border-radius: var(--r-md);
      color: var(--text-3);
      font-size: var(--fs-callout);
      line-height: var(--lh-callout);
      cursor: context-menu;
    }

    .sg-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin: 0 0 calc(-1 * var(--sp-2)) calc(-1 * var(--sp-3));
    }

    .sg-row > * {
      max-width: calc(100% - var(--sp-3));
      margin: 0 0 var(--sp-2) var(--sp-3);
    }

    .sg-row.is-tight {
      margin: 0 0 calc(-1 * var(--sp-2)) calc(-1 * var(--sp-2));
    }

    .sg-row.is-tight > * {
      margin: 0 0 var(--sp-2) var(--sp-2);
    }

    .sg-row + .sg-row {
      margin-top: var(--sp-2);
    }

    .sg-stack > * + * {
      margin-top: var(--sp-4);
    }

    .sg-stack.is-loose > * + * {
      margin-top: var(--sp-6);
    }

    .sg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(calc(var(--sp-12) * 3 + var(--sp-3)), 1fr));
      grid-gap: var(--sp-4);
      gap: var(--sp-4);
    }

    .sg-grid.is-wide {
      grid-template-columns: repeat(auto-fill, minmax(min(calc(var(--sp-12) * 6 + var(--sp-4)), 100%), 1fr));
    }

    .sg-note {
      margin-top: var(--sp-3);
      font-size: var(--fs-caption);
      line-height: var(--lh-caption);
      color: var(--text-3);
    }

    .sg-label {
      display: block;
      margin-bottom: var(--sp-2);
      font-size: var(--fs-caption);
      line-height: var(--lh-caption);
      font-weight: var(--fw-caption);
      color: var(--text-2);
    }

    /* токен или значение — неразрывным куском (переносы только по пробелам, R2-73) */
    .sg-nb {
      white-space: nowrap;
    }

    .sg-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: var(--fs-micro);
      line-height: var(--lh-micro);
      color: var(--text-3);
      overflow-wrap: anywhere;
    }

    /* ── знак ── */
    .sg-marks {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      margin: calc(-1 * var(--sp-4)) 0 0 calc(-1 * var(--sp-6));
    }

    .sg-mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: var(--sp-4) 0 0 var(--sp-6);
    }

    .sg-mark .sg-code {
      margin-top: var(--sp-2);
    }

    .sg-appicon {
      display: block;
      width: calc(var(--sp-12) * 2);
      height: calc(var(--sp-12) * 2);
      border-radius: calc(var(--r-xl) - var(--sp-1));
      box-shadow: var(--shadow-2);
    }

    .sg-appicon.is-s {
      width: var(--sp-12);
      height: var(--sp-12);
      border-radius: var(--r-sm);
    }

    /* purpose any: скругление нарисовано в самом файле (rx 14 из 64) — тень повторяет его */
    .sg-appicon.is-any {
      border-radius: 21.875%;
    }

    /* аватарка бота и maskable: Telegram и Android обрезают кругом */
    .sg-appicon.is-round {
      overflow: hidden;
      border-radius: 50%;
    }

    .sg-appicon-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .sg-appicon-svg .sg-safe {
      stroke: var(--line-strong);
      stroke-width: .5;
      stroke-dasharray: 1.5 1.5;
    }

    /* знак в обеих темах рядом: цвета — токены темы из таблицы стилей (styleguide.js, brandTheme) */
    .sg-mark-themes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(calc(var(--sp-12) * 3), 1fr));
      grid-gap: var(--sp-4);
      gap: var(--sp-4);
    }

    .sg-mark-theme {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--sp-5) var(--sp-4) var(--sp-4);
      border-radius: var(--r-md);
      background: var(--sg-mark-bg, var(--bg));
      box-shadow: inset 0 0 0 var(--bw) var(--line);
      color: var(--sg-mark-ink, var(--text));
    }

    .sg-mark-theme-row {
      display: flex;
      align-items: center;
    }

    .sg-mark-theme-row .ui-icon + .ui-icon {
      margin-left: var(--sp-5);
    }

    .sg-mark-theme .sg-code {
      margin-top: var(--sp-3);
      color: inherit;
    }

    /* ── палитра ── */
    .sg-swatch {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-radius: var(--r-md);
      background: var(--surface-1);
      box-shadow: var(--elev-1);
      overflow: hidden;
    }

    .sg-chip-color {
      position: relative;
      height: calc(var(--sp-12) + var(--sp-6));
      box-shadow: inset 0 calc(-1 * var(--bw)) 0 var(--line);
    }

    .sg-chip-color > span {
      position: absolute;
      left: var(--sp-3);
      bottom: var(--sp-2);
      font-size: var(--fs-callout);
      line-height: var(--lh-callout);
      font-weight: var(--fw-strong);
    }

    .sg-swatch-meta {
      padding: var(--sp-3);
    }

    .sg-swatch-name {
      font-size: var(--fs-callout);
      line-height: var(--lh-callout);
      font-weight: var(--fw-strong);
    }

    .sg-swatch-hex {
      margin-top: calc(var(--sp-1) / 2);
    }

    .sg-ratios {
      display: flex;
      flex-wrap: wrap;
      margin: var(--sp-1) 0 0 calc(-1 * var(--sp-1));
    }

    .sg-ratio {
      display: inline-flex;
      align-items: center;
      height: var(--h-badge);
      margin: var(--sp-1) 0 0 var(--sp-1);
      padding: 0 var(--sp-2);
      border-radius: var(--r-xs);
      background: var(--surface-2);
      color: var(--text-2);
      font-size: var(--fs-micro);
      line-height: var(--lh-micro);
      font-weight: var(--fw-micro);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .sg-ratio .ui-icon {
      margin-right: var(--sp-1);
    }

    .sg-ratio.is-pass {
      color: var(--text);
    }

    .sg-ratio.is-fail {
      background: transparent;
      box-shadow: inset 0 0 0 var(--bw) var(--line-strong);
    }

    /* ── типографика ── */
    .sg-type {
      display: grid;
      grid-template-columns: calc(var(--sp-12) * 3) minmax(0, 1fr);
      grid-gap: var(--sp-4);
      gap: var(--sp-4);
      align-items: baseline;
      padding: var(--sp-4) 0;
      border-bottom: var(--bw) solid var(--line);
    }

    .sg-type:last-child {
      border-bottom: 0;
    }

    .sg-type-sample {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    @media (max-width: 599px) {
      .sg-type {
        grid-template-columns: minmax(0, 1fr);
        grid-gap: var(--sp-1);
        gap: var(--sp-1);
      }
    }

    /* ── пространство ── */
    .sg-space {
      display: flex;
      align-items: center;
      padding: var(--sp-1) 0;
    }

    .sg-space .sg-code {
      flex: 0 0 calc(var(--sp-12) * 2);
    }

    .sg-space-bar {
      height: var(--sp-3);
      border-radius: var(--bw);
      background: var(--accent);
    }

    .sg-radius {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sg-radius-box {
      width: var(--sp-12);
      height: var(--sp-12);
      margin-bottom: var(--sp-2);
      background: var(--surface-2);
      box-shadow: inset 0 0 0 var(--bw) var(--line-strong);
    }

    /* ── иконки ── */
    .sg-icons {
      display: grid;
      /* 104 px: самое длинное имя («chevron-right», 13 знаков моноширинного 12 px) в одну строку;
         на 320 — две колонки, от 375 — три (R2-73) */
      grid-template-columns: repeat(auto-fill, minmax(calc(var(--sp-12) * 2 + var(--sp-2)), 1fr));
      grid-gap: var(--sp-2);
      gap: var(--sp-2);
    }

    .sg-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(var(--sp-12) + var(--sp-10));
      padding: var(--sp-3) var(--sp-1) var(--sp-2);
      border-radius: var(--r-sm);
      background: var(--surface-1);
      box-shadow: var(--elev-1);
      color: var(--text);
    }

    .sg-icon .sg-code {
      max-width: 100%;
      margin-top: var(--sp-3);
      overflow: hidden;
      text-align: center;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .sg-icon-note {
      max-width: 100%;
      margin-top: var(--sp-1);
      color: var(--text-2);
      font-size: var(--fs-caption);
      line-height: var(--lh-caption);
      text-align: center;
    }

    .sg-icon-pairs {
      margin-top: var(--sp-4);
    }

    .sg-icon-pair {
      display: flex;
      align-items: center;
      padding: var(--sp-2) var(--sp-3);
      border-radius: var(--r-sm);
      background: var(--surface-1);
      box-shadow: var(--elev-1);
      color: var(--text);
    }

    .sg-icon-pair > * + * {
      margin-left: var(--sp-2);
    }

    .sg-icon-scale {
      margin-top: var(--sp-4);
      color: var(--text);
    }

    .sg-icon-scale .sg-row + .sg-row {
      margin-top: var(--sp-3);
    }

    /* ── сцены моушна ── */
    .sg-demo {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-radius: var(--r-md);
      background: var(--surface-1);
      box-shadow: var(--elev-1);
      overflow: hidden;
    }

    .sg-demo-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(var(--sp-12) * 3 + var(--sp-4));
      padding: var(--sp-4);
      overflow: hidden;
    }

    .sg-demo-meta {
      display: flex;
      align-items: flex-start;
      padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4);
      border-top: var(--bw) solid var(--line);
    }

    .sg-demo-text {
      flex: 1 1 auto;
      min-width: 0;
      padding-top: var(--sp-1);
    }

    .sg-demo-name {
      font-size: var(--fs-callout);
      line-height: var(--lh-callout);
      font-weight: var(--fw-strong);
    }

    .sg-demo-meta > .ui-btn {
      flex-shrink: 0;
      margin-left: var(--sp-2);
    }

    /* узкий экран: кнопка демо под описанием, колонка описания во всю ширину карточки (R2-73) */
    @media (max-width: 399px) {
      .sg-demo-meta {
        flex-direction: column;
        align-items: flex-start;
      }

      .sg-demo-text {
        align-self: stretch;
      }

      .sg-demo-meta > .ui-btn {
        margin: var(--sp-3) 0 0 calc(-1 * var(--sp-1));
      }
    }

    .sg-tile {
      width: var(--sp-12);
      height: var(--sp-12);
      border-radius: var(--r-sm);
      background: var(--accent);
    }

    .sg-tiles > * + * {
      margin-left: var(--sp-2);
    }

    .sg-tiles {
      display: flex;
    }

    /* 5 плиток по 48 + зазоры 8 = 272 > сцены 256 на 320 px: плитки 40, ряд в полях карточки (R2-73) */
    @media (max-width: 359px) {
      .sg-tile {
        width: var(--sp-10);
        height: var(--sp-10);
      }
    }

    .sg-tile.is-soft {
      background: var(--surface-3);
    }

    .sg-mini-row {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: var(--h-row);
      padding: 0 var(--sp-2) 0 0;
      border-radius: var(--r-sm);
      background: var(--surface-1);
      box-shadow: var(--elev-1);
    }

    .sg-mini-row-text {
      flex: 1 1 auto;
      min-width: 0;
      font-size: var(--fs-body);
      line-height: var(--lh-body);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .sg-mini-row-meta {
      display: block;
      font-size: var(--fs-caption);
      line-height: var(--lh-caption);
      color: var(--text-2);
    }

    .sg-mini-list {
      width: 100%;
    }

    .sg-mini-list > * > * {
      display: flow-root;
    }

    .sg-mini-list .sg-mini-row {
      margin-bottom: var(--sp-2);
    }

    .sg-mini-list > :last-child .sg-mini-row {
      margin-bottom: 0;
    }

    .sg-timeline {
      position: relative;
      width: 100%;
      height: 100%;
      border-left: var(--bw) solid var(--line);
      margin-left: var(--sp-6);
    }

    .sg-hour {
      position: absolute;
      left: calc(-1 * var(--sp-6) - var(--sp-1));
      font-size: var(--fs-micro);
      line-height: var(--lh-micro);
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      transform: translateY(-50%);
    }

    .sg-now-line {
      position: absolute;
      left: calc(-1 * var(--now-dot) / 2);
      right: 0;
      top: 0;
      height: var(--now-line-w);
      background: var(--now);
      transition: transform var(--dur-slow) linear;
      pointer-events: none;
    }

    .sg-now-line::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: var(--now-dot);
      height: var(--now-dot);
      margin-top: calc(var(--now-dot) / -2);
      border-radius: 50%;
      background: var(--now);
    }

    .sg-offline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: var(--sp-8);
      padding: var(--sp-1) var(--sp-4);
      background: var(--signal-bg);
      color: var(--signal-text);
      font-size: var(--fs-caption);
      line-height: var(--lh-caption);
      font-weight: var(--fw-strong);
    }

    .sg-offline .ui-icon {
      margin-right: var(--sp-2);
    }

    .sg-placeholder {
      width: 100%;
    }

    .sg-placeholder .ui-input::placeholder {
      transition: opacity var(--dur-micro) var(--ease-standard);
    }

    .sg-placeholder.is-swap .ui-input::placeholder {
      opacity: 0;
    }

    .sg-vt-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: var(--sp-4);
      border-radius: var(--r-md);
      background: var(--surface-1);
      box-shadow: var(--elev-1);
    }

    .sg-vt-box .sg-code {
      margin-top: var(--sp-1);
    }

    .sg-week {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-gap: var(--sp-1);
      gap: var(--sp-1);
      width: 100%;
    }

    .sg-week-day {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-align: center;
      font-size: var(--fs-micro);
      line-height: var(--lh-micro);
      color: var(--text-2);
    }

    .sg-week-day > .ui-loadbar {
      margin-top: var(--sp-2);
    }

    .sg-week-slide {
      transition: transform var(--dur-base) var(--ease-standard), opacity var(--dur-base) var(--ease-standard);
    }

    .sg-week-slide.is-out-next {
      transform: translateX(calc(-1 * var(--sp-8)));
      opacity: 0;
    }

    .sg-week-slide.is-out-prev {
      transform: translateX(var(--sp-8));
      opacity: 0;
    }

    .sg-week-slide.is-jump {
      transition: none;
    }

    html[data-motion="off"] .sg-week-slide.is-out-next,
    html[data-motion="off"] .sg-week-slide.is-out-prev {
      transform: none;
    }

    html[data-motion="off"] .sg-week-slide {
      transition: opacity var(--dur-off) linear;
    }

    html[data-motion="off"] .sg-now-line {
      transition: none;
    }

    /* ── блоки недели: категории, дорога, окно ── */
    .sg-blocks {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(calc(var(--sp-12) * 3), 1fr));
      grid-gap: var(--sp-2);
      gap: var(--sp-2);
    }

    .sg-block {
      position: relative;
      min-height: calc(var(--sp-12) + var(--sp-6));
      padding: var(--sp-2) var(--sp-2) var(--sp-2) calc(var(--sp-2) + var(--cat-bar-w));
      border-radius: var(--r-xs);
      overflow: hidden;
      color: var(--cat-text);
    }

    .sg-block::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--cat-bar-w);
      background: var(--sg-bar);
    }

    .sg-block-title {
      display: flex;
      align-items: center;
      font-size: var(--fs-micro);
      line-height: var(--lh-micro);
      font-weight: var(--fw-strong);
    }

    .sg-block-title .ui-icon {
      margin-right: var(--sp-1);
    }

    .sg-block-time {
      margin-top: calc(var(--sp-1) / 2);
      font-size: var(--fs-tiny);
      line-height: var(--lh-micro);
      color: var(--cat-text-2);
      font-variant-numeric: tabular-nums;
    }

    .sg-block.is-road {
      color: var(--text-2);
      background-color: var(--surface-1);
      box-shadow: inset 0 0 0 var(--bw) var(--line);
    }

    .sg-block.is-road::before,
    .sg-block.is-window::before {
      display: none;
    }

    .sg-block.is-road,
    .sg-block.is-window {
      padding-left: var(--sp-2);
    }

    .sg-block.is-road .sg-block-time,
    .sg-block.is-window .sg-block-time {
      color: var(--text-2);
    }

    .sg-block.is-window {
      color: var(--text-2);
      border: var(--bw) dashed var(--line-strong);
    }

    .sg-card-note {
      padding: var(--sp-3) var(--sp-4);
      border-radius: var(--r-md);
      border: var(--bw) solid var(--sg-border);
      background: var(--sg-bg);
      box-shadow: var(--shadow-1), var(--edge);
    }

    .sg-card-note-1 {
      font-size: var(--fs-callout);
      line-height: var(--lh-callout);
      font-weight: var(--fw-strong);
      color: var(--sg-text);
    }

    .sg-card-note-2 {
      font-size: var(--fs-callout);
      line-height: var(--lh-callout);
      color: var(--sg-text-2);
    }

    .sg-board {
      padding: var(--sp-4);
      border-radius: var(--r-md);
      background-color: var(--board-bg);
      background-image: radial-gradient(var(--board-dot) var(--bw), transparent calc(var(--bw) + var(--bw) / 2));
      background-size: var(--sp-6) var(--sp-6);
      box-shadow: inset 0 0 0 var(--bw) var(--line);
    }

    /* ── «сейчас»-карточка ── */
    .sg-now-card {
      display: flex;
      align-items: flex-start;
    }

    .sg-now-card-main {
      flex: 1 1 auto;
      min-width: 0;
    }

    .sg-now-kicker {
      font-size: var(--fs-caption);
      line-height: var(--lh-caption);
      font-weight: var(--fw-strong);
      color: var(--accent-text);
    }

    .sg-now-title {
      margin-top: var(--sp-1);
      font-size: var(--fs-title-2);
      line-height: var(--lh-title-2);
      font-weight: var(--fw-title-2);
      letter-spacing: var(--ls-title-2);
    }

    .sg-now-meta {
      margin-top: var(--sp-1);
      font-size: var(--fs-callout);
      line-height: var(--lh-callout);
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
    }

    .sg-now-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      margin-left: var(--sp-4);
    }

    .sg-now-left {
      margin-top: var(--sp-1);
      font-size: var(--fs-caption);
      line-height: var(--lh-caption);
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .sg-now-progress {
      position: relative;
      height: var(--loadbar-h);
      margin-top: var(--sp-4);
      border-radius: var(--r-pill);
      background: var(--surface-3);
      overflow: hidden;
    }

    .sg-now-progress > span {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--accent);
      transform-origin: 0 50%;
      transition: transform var(--dur-slow) linear;
    }

    .sg-count {
      font-size: var(--fs-display);
